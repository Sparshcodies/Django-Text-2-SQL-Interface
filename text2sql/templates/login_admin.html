{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="container glass-container" data-aos="zoom-in">
  <h2>Admin Login</h2>

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label for="id_username">Username:</label>
      <input type="text" name="username" id="id_username" class="form-control" placeholder="Try 'admin'" required>
    </div>
    <div class="mb-3">
      <label for="id_password">Password:</label>
      <input type="password" name="password" id="id_password" class="form-control" placeholder="adminpassword" required>
    </div>
    <button type="submit" class="btn btn-glow">Login</button>
  </form>

  {% if messages and request.method == 'POST' %}
<script>
  document.addEventListener("DOMContentLoaded", function () {
    {% for message in messages %}
      Swal.fire({
        icon: "{{ message.tags|default:'info' }}",
        title: "{{ message|escapejs }}",
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 3500,
        timerProgressBar: true,
        background: '#fefefe',
        color: '#333',
        iconColor: '{% if message.tags == "success" %}#28a745{% elif message.tags == "error" %}#dc3545{% else %}#17a2b8{% endif %}',
        showClass: {
          popup: 'animate__animated animate__fadeInDown'
        },
        hideClass: {
          popup: 'animate__animated animate__fadeOutUp'
        }
      });
    {% endfor %}
  });
</script>
{% endif %}

</div>
{% endblock %}
