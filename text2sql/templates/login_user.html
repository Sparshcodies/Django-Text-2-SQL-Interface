{% extends "base.html" %}
{% block title %}User Login{% endblock %}

{% block content %}
<div class="container glass-container" data-aos="zoom-in">
  <h2>User Login</h2>

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label for="id_username">Username:</label>
      <input type="text" name="username" id="id_username" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="id_password">Password:</label>
      <input type="password" name="password" id="id_password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-glow">Login</button>
    <a href="{% url 'register' %}" class="btn btn-outline-secondary ms-2">New user? Register here</a>
  </form>

  {% if messages %}
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      {% for message in messages %}
        Swal.fire({
          icon: "{{ message.tags|default:'info' }}",
          title: "{{ message|escapejs }}",
          toast: true,
          position: 'top-end',
          showConfirmButton: false,
          timer: 3500,
          timerProgressBar: true,
          background: '#fefefe',
          color: '#333',
          iconColor: '{% if message.tags == "success" %}#28a745{% elif message.tags == "error" %}#dc3545{% else %}#17a2b8{% endif %}',
          showClass: {
            popup: 'animate__animated animate__fadeInDown'
          },
          hideClass: {
            popup: 'animate__animated animate__fadeOutUp'
          }
        });
      {% endfor %}
    });
  </script>
  {% endif %}
</div>
{% endblock %}
